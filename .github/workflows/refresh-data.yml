name: Refresh real NBA snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: nba-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/refresh_snapshots.py
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'nba-data';
            try {
              await github.rest.git.getRef({...context.repo, ref: 'heads/' + branch});
            } catch (error) {
              if (error.status !== 404) throw error;
              const main = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
              await github.rest.git.createRef({...context.repo, ref: 'refs/heads/' + branch, sha: main.data.object.sha});
            }
            for (const file of fs.readdirSync('snapshots').filter(x => x.endsWith('.json.gz'))) {
              const path = 'snapshots/' + file;
              let sha;
              try {
                const old = await github.rest.repos.getContent({...context.repo, path, ref: branch});
                sha = old.data.sha;
              } catch (error) { if (error.status !== 404) throw error; }
              await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch,
                message: 'Refresh verified NBA snapshot ' + file,
                content: fs.readFileSync(path).toString('base64'), ...(sha ? {sha} : {})});
            }
